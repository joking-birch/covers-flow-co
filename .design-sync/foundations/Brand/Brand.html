<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brand marks — CoversFlow</title>
<link rel="stylesheet" href="../../../styles.css">
<style>
  body { margin: 0; padding: var(--s-5); background: var(--paper); color: var(--ink); }
  h2 { font: 500 var(--step--1) var(--font-mono); letter-spacing: var(--tracking-caps);
       text-transform: uppercase; color: var(--ink-3); margin: 0 0 var(--s-3); }
  section { margin-bottom: var(--s-6); }
  .btn { background: transparent; border: 1px solid var(--ink); color: var(--ink);
         font: 500 var(--step-0) var(--font-body); padding: var(--s-3) var(--s-5);
         border-radius: var(--radius-sm); transition: all var(--dur-fast) var(--ease); }
  .btn.hover { background: var(--rust); border-color: var(--rust); color: var(--paper); }
  .btn.pressed { background: var(--rust-deep); border-color: var(--rust-deep); color: var(--paper); }
  .btn.focus { outline: 2px solid var(--rust); outline-offset: 2px; }
  .lbl { font: 400 10px var(--font-mono); color: var(--ink-3); display: block; margin-top: var(--s-2); }
  .cols { display: flex; gap: var(--s-5); align-items: flex-start; }
  .band { background: var(--rust); color: var(--paper); padding: var(--s-4) var(--s-5);
          font: 500 var(--step-1) var(--font-display); letter-spacing: var(--tracking-tight); }
</style>
</head>
<body>
<div id="root">
  <section>
    <h2>The three-bar mark — above section headings</h2>
    <div class="mark"><i></i><i></i><i></i></div>
    <h3 style="font: 500 var(--step-2) var(--font-display); letter-spacing: var(--tracking-tight); margin: 0">
      Front of house</h3>
  </section>
  <section>
    <h2>Buttons — ink outline, rust on hover, rust-deep pressed</h2>
    <div class="cols">
      <div><button class="btn">See the audit</button><span class="lbl">default</span></div>
      <div><button class="btn hover">See the audit</button><span class="lbl">hover</span></div>
      <div><button class="btn pressed">See the audit</button><span class="lbl">pressed</span></div>
      <div><button class="btn focus">See the audit</button><span class="lbl">focus ring</span></div>
    </div>
  </section>
  <section style="margin-bottom: 0">
    <h2>The rust band — at most one per page</h2>
    <div class="band">Hospitality SEO, done like a poster.</div>
  </section>
</div>
</body>
</html>
